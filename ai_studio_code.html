<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>MASQUE — A Word of Deception</title>
<meta name="description" content="A social deduction party game. Everyone wears a word. Someone's is different.">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MASQUE — Design Tokens
   Integrated beautifully with requested OKLCH theme and Google Fonts.
   ============================================================ */
:root {
  --background: oklch(0.9232 0.0026 48.7171);
  --foreground: oklch(0.2795 0.0368 260.0310);
  --card: oklch(0.9699 0.0013 106.4238);
  --card-foreground: oklch(0.2795 0.0368 260.0310);
  --popover: oklch(0.9699 0.0013 106.4238);
  --popover-foreground: oklch(0.2795 0.0368 260.0310);
  --primary: oklch(0.5854 0.2041 277.1173);
  --primary-foreground: oklch(1.0000 0 0); /* White */
  --secondary: oklch(0.8687 0.0043 56.3660);
  --secondary-foreground: oklch(0.4461 0.0263 256.8018);
  --muted: oklch(0.9232 0.0026 48.7171);
  --muted-foreground: oklch(0.5510 0.0234 264.3637);
  --accent: oklch(0.9376 0.0260 321.9388);
  --accent-foreground: oklch(0.3729 0.0306 259.7328);
  --destructive: oklch(0.6368 0.2078 25.3313);
  --destructive-foreground: oklch(1.0000 0 0);
  --border: oklch(0.8687 0.0043 56.3660);
  --input: oklch(0.8687 0.0043 56.3660);
  --ring: oklch(0.5854 0.2041 277.1173);
  
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-serif: 'Lora', serif;
  --font-mono: 'Roboto Mono', monospace;
  --radius: 1.25rem;
  
  --shadow-sm: 2px 2px 10px 4px hsl(240 4% 60% / 0.18), 2px 1px 2px 3px hsl(240 4% 60% / 0.18);
  --shadow-md: 2px 2px 10px 4px hsl(240 4% 60% / 0.18), 2px 2px 4px 3px hsl(240 4% 60% / 0.18);
  
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --background: oklch(0.2244 0.0074 67.4370);
  --foreground: oklch(0.9288 0.0126 255.5078);
  --card: oklch(0.2801 0.0080 59.3379);
  --card-foreground: oklch(0.9288 0.0126 255.5078);
  --popover: oklch(0.2801 0.0080 59.3379);
  --popover-foreground: oklch(0.9288 0.0126 255.5078);
  --primary: oklch(0.6801 0.1583 276.9349);
  --primary-foreground: oklch(0.2244 0.0074 67.4370); /* Dark text on bright primary */
  --secondary: oklch(0.3359 0.0077 59.4197);
  --secondary-foreground: oklch(0.8717 0.0093 258.3382);
  --muted: oklch(0.2287 0.0074 67.4469);
  --muted-foreground: oklch(0.7137 0.0192 261.3246);
  --accent: oklch(0.3896 0.0074 59.4734);
  --accent-foreground: oklch(0.8717 0.0093 258.3382);
  --destructive: oklch(0.6368 0.2078 25.3313);
  --destructive-foreground: oklch(0.2244 0.0074 67.4370);
  --border: oklch(0.3359 0.0077 59.4197);
  --input: oklch(0.3359 0.0077 59.4197);
  --ring: oklch(0.6801 0.1583 276.9349);
  
  --shadow-sm: 2px 2px 10px 4px hsl(0 0% 0% / 0.18), 2px 1px 2px 3px hsl(0 0% 0% / 0.18);
  --shadow-md: 2px 2px 10px 4px hsl(0 0% 0% / 0.18), 2px 2px 4px 3px hsl(0 0% 0% / 0.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background-color: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}
button{font-family:inherit;}
::selection{background:var(--primary);color:var(--primary-foreground);}
:focus-visible{outline:2px solid var(--ring);outline-offset:3px;border-radius:6px;}

#app{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:560px;
  margin:0 auto;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  position:relative;
}

/* ---------- Typography ---------- */
h1.title, .brand, .pass-name, .word, .who, .modal-title, .winner-banner h1 {
  font-family: var(--font-serif);
}
.eyebrow, .round-tag, .stepper .value, .role-chip, .role-label, .num, .tap-txt, .footer-note, .role-badge, .tag, .timer-display {
  font-family: var(--font-mono);
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 6px;
}
.brand{
  display:flex;align-items:baseline;gap:8px;
  font-size:1.15rem;
  letter-spacing:0.12em;
  color: var(--foreground);
}
.brand .dot{color:var(--primary);}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--border);
  background:var(--secondary);
  color:var(--secondary-foreground);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .2s var(--ease-soft);
}
.icon-btn:hover{background:var(--accent);color:var(--accent-foreground);border-color:var(--ring);}
.icon-btn:active{transform:scale(0.92);}
.icon-btn svg{width:18px;height:18px;}

/* ---------- Main content ---------- */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:8px 22px 32px;
  animation:screenIn .5s var(--ease) both;
}
@keyframes screenIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.screen.leaving{animation:screenOut .28s var(--ease-soft) both;}
@keyframes screenOut{
  from{opacity:1;transform:translateY(0);}
  to{opacity:0;transform:translateY(-8px);}
}

.eyebrow{
  font-size:0.7rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--muted-foreground);
  margin-bottom:10px;
}
h1.title{
  font-size:2.1rem;
  font-weight:400;
  line-height:1.15;
  color:var(--foreground);
  margin-bottom:8px;
  letter-spacing:0.01em;
}
p.subtitle{
  color:var(--muted-foreground);
  font-size:0.95rem;
  line-height:1.5;
  margin-bottom:28px;
  max-width:42ch;
}

/* ---------- Setup: config cards ---------- */
.config-card{
  background:var(--card);
  color:var(--card-foreground);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.config-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.config-label{display:flex;flex-direction:column;gap:2px;}
.config-label .name{font-size:0.95rem;font-weight:600;}
.config-label .hint{font-size:0.78rem;color:var(--muted-foreground);}
.stepper{
  display:flex;align-items:center;gap:14px;
  background:var(--secondary);
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px 8px;
}
.stepper button{
  width:30px;height:30px;border-radius:9px;
  border:none;background:transparent;
  color:var(--primary);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s var(--ease-soft);
}
.stepper button:hover:not(:disabled){background:var(--card);}
.stepper button:active:not(:disabled){transform:scale(0.85);}
.stepper button:disabled{opacity:0.25;cursor:not-allowed;}
.stepper .value{
  font-size:1.05rem;
  min-width:22px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.role-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.72rem;padding:3px 9px;border-radius:100px;
  letter-spacing:0.03em;
}
.role-chip.civ, .role-badge.civ {
  background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border);
}
.role-chip.undercover, .role-badge.undercover {
  background:var(--destructive);color:var(--destructive-foreground);border:1px solid var(--destructive);
}
.role-chip.white, .role-badge.white {
  background:var(--accent);color:var(--accent-foreground);border:1px solid var(--border);
}

.validation-msg{
  display:flex;align-items:center;gap:8px;
  font-size:0.82rem;color:var(--destructive);
  background:var(--card);
  border:1px solid var(--destructive);
  border-radius:12px;padding:10px 14px;margin-top:4px;margin-bottom:14px;
  animation:shake .4s var(--ease-soft);
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

/* toggle switch */
.switch{
  position:relative;width:44px;height:26px;flex-shrink:0;
}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch label{
  position:absolute;inset:0;border-radius:100px;
  background:var(--secondary);border:1px solid var(--border);
  cursor:pointer;transition:all .3s var(--ease-soft);
}
.switch label::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;
  background:var(--muted-foreground);
  transition:all .3s var(--ease);
}
.switch input:checked + label{background:var(--primary);border-color:var(--primary);}
.switch input:checked + label::after{transform:translateX(18px);background:var(--primary-foreground);}

.names-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.name-input{
  display:flex;align-items:center;gap:10px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:12px;padding:9px 14px;
}
.name-input .num{color:var(--muted-foreground);font-size:0.8rem;width:16px;}
.name-input input{
  flex:1;background:none;border:none;color:var(--foreground);
  font-size:0.92rem;font-family:var(--font-sans);
}
.name-input input:focus{outline:none;}
.name-input input::placeholder{color:var(--muted-foreground);opacity:0.6;}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 24px;border-radius:16px;
  font-size:1rem;font-weight:600;letter-spacing:0.02em;
  border:none;cursor:pointer;
  transition:all .2s var(--ease-soft);
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:var(--primary);
  color:var(--primary-foreground);
  box-shadow:var(--shadow-sm);
}
.btn-primary:hover:not(:disabled){box-shadow:var(--shadow-md);opacity:0.9;}
.btn-primary:disabled{opacity:0.4;box-shadow:none;cursor:not-allowed;transform:none;}
.btn-ghost{
  background:transparent;
  color:var(--foreground);
  border:1px solid var(--border);
}
.btn-ghost:hover{background:var(--secondary);color:var(--secondary-foreground);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;margin-top:auto;padding-top:18px;}

/* ---------- Reveal screen ---------- */
.reveal-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:28px;
}
.pass-name{
  font-size:1.7rem;color:var(--foreground);
}
.pass-hint{color:var(--muted-foreground);font-size:0.88rem;}

.card-scene{
  width:100%;max-width:290px;aspect-ratio:3/4.3;
  perspective:1400px;
}
.card{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .7s var(--ease);
  cursor:pointer;
}
.card.flipped{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;
  border-radius:var(--radius);
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-md);
  background:var(--card);
}
.card-back{
  background:repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 12px), linear-gradient(160deg, var(--card), var(--background));
}
.card-back .seal{
  width:88px;height:88px;border-radius:50%;
  background:var(--primary);
  color:var(--primary-foreground);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px -6px var(--ring);
  font-size:1.6rem;
  margin-bottom:22px;
  animation:pulseGlow 2.6s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 8px 24px -6px var(--ring);}
  50%{box-shadow:0 12px 34px -4px var(--ring);}
}
.card-back .tap-txt{font-size:0.78rem;letter-spacing:0.14em;color:var(--muted-foreground);text-transform:uppercase;}
.card-front{
  transform:rotateY(180deg);
  gap:14px;
}
.card-front .role-label{
  font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted-foreground);
}
.card-front .word{
  font-size:2.3rem;color:var(--foreground);text-align:center;line-height:1.15;
}
.card-front .word.mrwhite{font-size:1.35rem;color:var(--accent);max-width:22ch;line-height:1.4;}
.card-front .role-icon{font-size:1.8rem;margin-bottom:2px;}

.progress-dots{display:flex;gap:7px;justify-content:center;}
.progress-dots .d{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s var(--ease-soft);}
.progress-dots .d.done{background:var(--muted-foreground);}
.progress-dots .d.current{background:var(--primary);width:16px;border-radius:4px;}

/* ---------- Ready / Discussion screens ---------- */
.center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;}
.big-icon{font-size:2.6rem;}
.timer-display{
  font-size:3.4rem;color:var(--primary);
  font-variant-numeric:tabular-nums;letter-spacing:0.02em;
}
.timer-display.low{color:var(--destructive);animation:tick 1s ease-in-out infinite;}
@keyframes tick{0%,100%{opacity:1;}50%{opacity:0.55;}}
.round-tag{
  font-size:0.75rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--accent-foreground);background:var(--accent);
  border:1px solid var(--border);
  padding:6px 14px;border-radius:100px;
}

.player-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:14px;width:100%;margin:12px 0;
}
.player-chip{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:all .2s var(--ease-soft);
  text-align:center;position:relative;
  box-shadow:var(--shadow-sm);
}
.player-chip:hover{transform:translateY(-2px);border-color:var(--ring);}
.player-chip:active{transform:scale(0.96);}
.player-chip.selected{border-color:var(--primary);background:var(--secondary);}
.player-chip.eliminated{opacity:0.4;cursor:default;pointer-events:none;box-shadow:none;}
.player-chip.eliminated:hover{transform:none;}
.player-chip .avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-size:1rem;color:var(--primary-foreground);
}
.player-chip .pname{font-size:0.85rem;font-weight:600;color:var(--foreground);}
.first-marker {
  position: absolute;
  top: -10px;
  background-color: var(--accent);
  color: var(--accent-foreground);
  font-size: 0.65rem;
  padding: 3px 10px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  box-shadow: var(--shadow-sm);
}

/* ---------- Elimination / reveal modal ---------- */
.reveal-panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px 26px;text-align:center;
  box-shadow:var(--shadow-md);
  animation:panelIn .5s var(--ease) both;
}
@keyframes panelIn{
  from{opacity:0;transform:scale(0.94) translateY(8px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.reveal-panel .who{font-size:1.6rem;margin-bottom:4px;}
.reveal-panel .was{font-size:0.95rem;color:var(--muted-foreground);margin-bottom:18px;}
.role-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:100px;
  font-size:0.95rem;letter-spacing:0.04em;
}

.guess-input{
  width:100%;background:var(--input);border:1px solid var(--border);
  border-radius:14px;padding:16px 16px;color:var(--foreground);font-size:1.05rem;
  text-align:center;font-family:var(--font-sans);margin:16px 0;
  transition: all 0.3s var(--ease);
}
.guess-input:focus{outline:none;border-color:var(--ring);}
.guess-input.wrong-guess {
  border-color: var(--destructive) !important;
  color: var(--destructive) !important;
  animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
}

/* ---------- Results ---------- */
.winner-banner{
  text-align:center;padding:36px 20px 28px;
}
.winner-banner .crest{
  width:76px;height:76px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  background:var(--primary);color:var(--primary-foreground);
  box-shadow:var(--shadow-md);
}
.winner-banner h1{font-size:2rem;}
.reveal-list{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
.reveal-row{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:14px;
  box-shadow:var(--shadow-sm);
}
.reveal-row .avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-size:1rem;color:var(--primary-foreground);
}
.reveal-row .info{flex:1;text-align:left;}
.reveal-row .rn{font-size:0.95rem;font-weight:600;}
.reveal-row .rw{font-size:0.85rem;color:var(--muted-foreground);margin-top:2px;}
.reveal-row .role-badge { padding:6px 12px; font-size:0.75rem; margin-bottom:0; }

canvas#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:999;}

/* ---------- Settings modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;z-index:200;
  animation:fadeIn .25s var(--ease-soft);
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@media (min-width:560px){.modal-backdrop{align-items:center;}}
.modal-sheet{
  background:var(--card);border:1px solid var(--border);
  border-radius:24px 24px 0 0;padding:26px 22px 34px;
  width:100%;max-width:480px;max-height:82vh;overflow-y:auto;
  box-shadow:var(--shadow-md);
  animation:sheetUp .35s var(--ease);
}
@media (min-width:560px){.modal-sheet{border-radius:24px;padding-bottom:26px;}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-size:1.35rem;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;border-bottom:1px solid var(--border);
}
.setting-row:last-child{border-bottom:none;}
.setting-row .label{font-size:0.95rem;font-weight:600;}
.setting-row .desc{font-size:0.8rem;color:var(--muted-foreground);margin-top:4px;}

.footer-note{
  text-align:center;color:var(--muted-foreground);font-size:0.75rem;padding:14px 22px 6px;
  letter-spacing:0.02em;
}

@media (max-width:380px){
  h1.title{font-size:1.8rem;}
  .card-front .word{font-size:1.9rem;}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";

/* ============================================================
   Word list — Handpicked for better similarity
   ============================================================ */
const WORD_PAIRS = [

/* ============================================================
   Utilities
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function haptic(pattern){
  if(state.settings.hapticOn && navigator.vibrate){ navigator.vibrate(pattern); }
}
let audioCtx = null;
function beep(freq=660, dur=0.09, type='sine', vol=0.06){
  if(!state.settings.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur + 0.02);
  }catch(e){/* audio unsupported, ignore */}
}

/* ============================================================
   Validation
   ============================================================ */
function validateSetup(){
  const s = state.setup;
  const errors = [];
  if(s.playerCount < 3) errors.push('You need at least 3 players.');
  if(s.playerCount > 20) errors.push('Maximum 20 players.');
  if(s.undercoverCount + s.mrWhiteCount >= s.playerCount){
    errors.push('There must be at least one Civilian left.');
  }
  if(s.undercoverCount < 0 || s.mrWhiteCount < 0) errors.push('Counts cannot be negative.');
  const civilians = s.playerCount - s.undercoverCount - s.mrWhiteCount;
  if(civilians < s.undercoverCount + s.mrWhiteCount && civilians <= 0){
    errors.push('Civilians must remain in the majority to start.');
  }
  return errors;
}

/* ============================================================
   Game logic
   ============================================================ */
function startGame(){
  const s = state.setup;
  const pair = WORD_PAIRS[randInt(0, WORD_PAIRS.length-1)];
  const civWord = Math.random() < 0.5 ? pair[0] : pair[1];
  const underWord = civWord === pair[0] ? pair[1] : pair[0];
  state.wordPair = { civ: civWord, under: underWord };

  const roles = [];
  for(let i=0;i<s.undercoverCount;i++) roles.push('undercover');
  for(let i=0;i<s.mrWhiteCount;i++) roles.push('mrwhite');
  while(roles.length < s.playerCount) roles.push('civilian');
  const shuffledRoles = shuffle(roles);

  const names = s.useNames ? s.names : defaultNames(s.playerCount);
  state.players = shuffle(names.map((name, idx)=>({id: idx, name: name || ('Player '+(idx+1))})))
    .map((p, i)=>{
      const role = shuffledRoles[i];
      return {
        id: p.id,
        name: p.name,
        role,
        word: role==='civilian' ? state.wordPair.civ : role==='undercover' ? state.wordPair.under : null,
        alive: true,
      };
    });

  state.revealIndex = 0;
  state.round = 1;
  state.eliminationTarget = null;
  state.eliminationResult = null;
  state.gameOverWinner = null;
  goTo('reveal');
}

function checkWinCondition(){
  const alive = state.players.filter(p=>p.alive);
  const civAlive = alive.filter(p=>p.role==='civilian').length;
  const infAlive = alive.filter(p=>p.role!=='civilian').length;
  if(infAlive === 0) return 'civilians';
  if(infAlive >= civAlive) return 'infiltrators';
  return null;
}

  state.screen = screen;

  let html = '';

    case 'discussion': html = renderDiscussion(); break;

    case 'eliminationReveal': html = renderEliminationReveal(); break;
    case 'whiteGuess': html = renderWhiteGuess(); break;
    case 'results': html = renderResults(); break;

  app.innerHTML = topbarHtml() + '<div class="screen" id="screenRoot">' + html + '</div>' + footerHtml();
  attachGlobalHandlers();
  attachScreenHandlers();
  if(state.showSettings) renderSettingsModal();
}

function renderReveal(){
  const i = state.revealIndex;
  const player = state.players[i];
  const total = state.players.length;
  const flipped = player._flipped || false;

  let dots = '';
  for(let d=0; d<total; d++){
    let cls = 'd';
    if(d < i) cls += ' done';
    else if(d === i) cls += ' current';
    dots += `<span class="${cls}"></span>`;
  }

  const roleIcon = player.role==='civilian' ? '🎭' : player.role==='undercover' ? '🎭' : '❔';
  const front = flipped ? `
      <div class="card-face card-front">
        <div class="role-icon">${roleIcon}</div>
        <div class="role-label">${player.role==='mrwhite' ? 'Your word' : 'Your word is'}</div>

          ? `<div class="word mrwhite">You have no word.<br>Blend in, and don't get caught.</div>`
          : `<div class="word">${escapeHtml(player.word)}</div>`}

  return `

  return `
    <div class="center-screen">
      <div class="reveal-panel" style="width:100%;">
        <div class="who">One last chance</div>
        <div class="role-badge white">Mr. White</div>
        <p class="subtitle" style="margin:14px auto 0;">${escapeHtml(state.eliminationResult.name)} was caught — but Mr. White gets one guess at the civilians' word. Guess correctly to steal the win.</p>
        <input type="text" id="whiteGuessInput" class="guess-input" placeholder="Guess the word…" autocomplete="off" autofocus>
      </div>
      <div class="btn-row" style="width:100%;gap:10px;">
        <button class="btn btn-ghost" id="btnSkipGuess">Skip guess</button>
        <button class="btn btn-primary btn-block" id="btnSubmitGuess">Submit guess</button>
      </div>
    </div>
  `;
}

/* ---------------- Results screen ---------------- */
function renderResults(){
  const winner = state.gameOverWinner;
  const civWon = winner === 'civilians';
  let title = civWon ? 'The Civilians prevail.' : 'The Infiltrators win the table.';
  let sub = civWon
    ? 'Every undercover word and every silent guest has been unmasked.'
    : 'Deception outlasted suspicion tonight.';

  let rows = '';
  state.players.forEach(p=>{
    const badgeClass = p.role==='civilian'?'civ':p.role==='undercover'?'undercover':'white';
    const roleName = p.role==='civilian'?'Civilian':p.role==='undercover'?'Undercover':'Mr. White';
    const wordTxt = p.role==='mrwhite' ? 'No word' : p.word;
    rows += `<div class="reveal-row">
      <div class="avatar">${initials(p.name)}</div>
      <div class="info"><div class="rn">${escapeHtml(p.name)}${p.alive?'':' <span style="color:var(--muted-foreground);font-weight:400;font-size:0.8rem">· eliminated</span>'}</div><div class="rw">${escapeHtml(wordTxt)}</div></div>
      <span class="role-badge ${badgeClass}" style="padding:4px 10px;font-size:0.7rem;margin-bottom:0;">${roleName}</span>
    </div>`;
  });

  return `
    <div class="winner-banner">
      <div class="crest">${civWon?'🎭':'🗝️'}</div>
      <h1 class="title" style="margin-bottom:6px;">${title}</h1>
      <p class="subtitle" style="margin:0 auto;">${sub}</p>
    </div>
    <div class="eyebrow">The full reveal</div>
    <div class="reveal-list">${rows}</div>
    <div class="btn-row" style="width:100%;gap:10px;">
      <button class="btn btn-ghost btn-block" id="btnNewSetup">New setup</button>
      <button class="btn btn-primary btn-block" id="btnPlayAgain">Play again</button>
    </div>
  `;
}

/* ============================================================
   Settings modal
   ============================================================ */
function renderSettingsModal(){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'settingsBackdrop';
  wrap.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-title">Settings <button class="icon-btn" id="btnCloseSettings" aria-label="Close">✕</button></div>
      <div class="setting-row">
        <div><div class="label">Sound effects</div><div class="desc">Soft chimes on taps and timers</div></div>
        <div class="switch"><input type="checkbox" id="setSound" ${state.settings.soundOn?'checked':''}><label for="setSound"></label></div>
      </div>
      <div class="setting-row">
        <div><div class="label">Haptic feedback</div><div class="desc">Vibration on supported devices</div></div>
        <div class="switch"><input type="checkbox" id="setHaptic" ${state.settings.hapticOn?'checked':''}><label for="setHaptic"></label></div>
      </div>
      <div class="setting-row">
        <div><div class="label">Restart game</div><div class="desc">Return to table setup</div></div>
        <button class="btn btn-ghost" id="setRestart" style="padding:10px 16px;">Restart</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target === wrap){ closeSettings(); }});
  document.getElementById('btnCloseSettings').onclick = closeSettings;
  document.getElementById('setSound').onchange = e=>{ state.settings.soundOn = e.target.checked; saveState(); };
  document.getElementById('setHaptic').onchange = e=>{ state.settings.hapticOn = e.target.checked; saveState(); };
  document.getElementById('setRestart').onclick = ()=>{ closeSettings(); resetToSetup(); };
}
function closeSettings(){
  state.showSettings = false;
  saveState();
  const el = document.getElementById('settingsBackdrop');
  if(el) el.remove();
}

/* ============================================================
   Global handlers (topbar)
   ============================================================ */
function attachGlobalHandlers(){
  const themeBtn = document.getElementById('btnTheme');
  if(themeBtn) themeBtn.onclick = ()=>{
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    const nxt = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', nxt);
    localStorage.setItem('masque_theme', nxt);
    beep(500,0.08,'sine',0.04);
    render();
  };
  const fsBtn = document.getElementById('btnFullscreen');
  if(fsBtn) fsBtn.onclick = ()=>{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.().catch(()=>{}); }
    else{ document.exitFullscreen?.(); }
  };
  const setBtn = document.getElementById('btnSettings');
  if(setBtn) setBtn.onclick = ()=>{ state.showSettings = true; saveState(); renderSettingsModal(); };
}

/* ============================================================
   Screen-specific handlers
   ============================================================ */
function attachScreenHandlers(){
  switch(state.screen){
    case 'setup': attachSetupHandlers(); break;
    case 'reveal': attachRevealHandlers(); break;
    case 'ready': attachReadyHandlers(); break;
    case 'discussion': attachDiscussionHandlers(); break;
    case 'voting': attachVotingHandlers(); break;
    case 'eliminationReveal': attachEliminationHandlers(); break;
    case 'whiteGuess': attachWhiteGuessHandlers(); break;
    case 'results': attachResultsHandlers(); break;
  }
}

function attachSetupHandlers(){
  const s = state.setup;
  const on = (id, fn)=>{ const el=document.getElementById(id); if(el) el.onclick = fn; };
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const act = btn.getAttribute('data-act');
      if(act==='inc-players'){ s.playerCount = Math.min(20, s.playerCount+1); syncNames(); }
      if(act==='dec-players'){ s.playerCount = Math.max(3, s.playerCount-1); syncNames(); }
      if(act==='inc-under'){ s.undercoverCount++; }
      if(act==='dec-under'){ s.undercoverCount = Math.max(0, s.undercoverCount-1); }
      if(act==='inc-white'){ s.mrWhiteCount++; }
      if(act==='dec-white'){ s.mrWhiteCount = Math.max(0, s.mrWhiteCount-1); }
      if(act==='inc-disc'){ s.discussionSeconds += 30; }
      if(act==='dec-disc'){ s.discussionSeconds = Math.max(30, s.discussionSeconds-30); }
      if(act==='inc-vote'){ s.votingSeconds += 15; }
      if(act==='dec-vote'){ s.votingSeconds = Math.max(15, s.votingSeconds-15); }
      beep(700,0.05,'sine',0.03); haptic(8);
      saveState();
      render();
    };
  });
  const toggleNames = document.getElementById('toggleNames');
  if(toggleNames) toggleNames.onchange = e=>{ s.useNames = e.target.checked; syncNames(); saveState(); render(); };
  const toggleDisc = document.getElementById('toggleDiscTimer');
  if(toggleDisc) toggleDisc.onchange = e=>{ s.useDiscussionTimer = e.target.checked; saveState(); render(); };
  const toggleVote = document.getElementById('toggleVoteTimer');
  if(toggleVote) toggleVote.onchange = e=>{ s.useVotingTimer = e.target.checked; saveState(); render(); };
  document.querySelectorAll('.nameField').forEach(inp=>{
    inp.oninput = e=>{ 
      s.names[parseInt(e.target.dataset.idx,10)] = e.target.value; 
      saveNames();
      saveState();
    };
  });
  on('btnStart', ()=>{
    if(validateSetup().length) return;
    beep(880,0.12,'sine',0.05); haptic([10,30,10]);
    startGame();
  });
}
function syncNames(){
  const s = state.setup;
  while(s.names.length < s.playerCount) s.names.push('');
  s.names.length = s.playerCount;
  saveNames();
}

function attachRevealHandlers(){
  const card = document.getElementById('revealCard');
  const player = state.players[state.revealIndex];
  if(card){
    card.onclick = ()=>{
      if(player._flipped) return;
      player._flipped = true;
      beep(520,0.15,'triangle',0.05); haptic(15);
      saveState();
      render();
    };
  }
  const nextBtn = document.getElementById('btnNextReveal');
  if(nextBtn){
    nextBtn.onclick = ()=>{
      if(state.revealIndex < state.players.length - 1){
        state.revealIndex++;
        beep(660,0.08,'sine',0.04); haptic(10);
        goTo('reveal');
      } else {
        beep(760,0.1,'sine',0.04); haptic(10);
        goTo('ready');
      }
    };
  }
}

function attachReadyHandlers(){
  const btn = document.getElementById('btnStartDiscussion');
  if(btn) btn.onclick = ()=>{ enterDiscussion(); };
}

function enterDiscussion(){
  const s = state.setup;
  const alive = state.players.filter(p=>p.alive);
  
  // Randomise discussion order
  let order = shuffle(alive.map(p=>p.id));
  
  // Ensure the first player is not Mr. White, if possible
  let firstPlayer = state.players.find(p => p.id === order[0]);
  if (firstPlayer && firstPlayer.role === 'mrwhite' && order.length > 1) {
    const nonWhiteIdx = order.findIndex(id => state.players.find(p => p.id === id).role !== 'mrwhite');
    if (nonWhiteIdx > 0) {
      [order[0], order[nonWhiteIdx]] = [order[nonWhiteIdx], order[0]];
    }
  }
  
  state.discussionOrder = order;

  if(s.useDiscussionTimer){
    state.timerRemaining = s.discussionSeconds;
    state.timerKind = 'discussion';
    startTimer();
  }
  goTo('discussion');
}
function attachDiscussionHandlers(){
  const pauseBtn = document.getElementById('btnPauseTimer');
  if(pauseBtn) pauseBtn.onclick = ()=>{
    if(state.timerRunning){ pauseTimer(); } else { resumeTimer(); }
    render();
  };
  const voteBtn = document.getElementById('btnStartVoting');
  if(voteBtn) voteBtn.onclick = ()=>{ stopTimer(); enterVoting(); };
}

function enterVoting(){
  const s = state.setup;
  state.eliminationTarget = null;
  if(s.useVotingTimer){
    state.timerRemaining = s.votingSeconds;
    state.timerKind = 'voting';
    startTimer();
  }
  goTo('voting');
}
function attachVotingHandlers(){
  document.querySelectorAll('[data-vote]').forEach(chip=>{
    chip.onclick = ()=>{
      state.eliminationTarget = parseInt(chip.getAttribute('data-vote'),10);
      beep(600,0.06,'sine',0.04); haptic(8);
      saveState();
      render();
    };
  });
  const confirmBtn = document.getElementById('btnConfirmVote');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    stopTimer();
    performElimination();
  };
}

function performElimination(){
  const target = state.players.find(p=>p.id === state.eliminationTarget);
  if(!target) return;
  target.alive = false;
  state.eliminationResult = target;
  beep(320,0.2,'sawtooth',0.05); haptic([20,40,20]);
  goTo('eliminationReveal');
}
function attachEliminationHandlers(){
  const btn = document.getElementById('btnContinueAfterElim');
  if(btn) btn.onclick = ()=>{
    if(state.eliminationResult.role === 'mrwhite'){
      goTo('whiteGuess');
      return;
    }
    afterElimResolved();
  };
}

function attachWhiteGuessHandlers(){
  const skipBtn = document.getElementById('btnSkipGuess');
  const submitBtn = document.getElementById('btnSubmitGuess');
  const input = document.getElementById('whiteGuessInput');
  if(skipBtn) skipBtn.onclick = ()=>{ afterElimResolved(); };
  if(submitBtn) submitBtn.onclick = ()=>{
    const guess = (input.value||'').trim().toLowerCase();
    const answer = state.wordPair.civ.toLowerCase();
    if(guess && guess === answer){
      state.gameOverWinner = 'infiltrators';
      launchConfetti();
      goTo('results');
    } else {
      input.classList.add('shake', 'wrong-guess');
      beep(150,0.2,'sawtooth',0.05);
      haptic([30,40,30]);
      setTimeout(()=>{
        input.classList.remove('shake', 'wrong-guess');
        afterElimResolved();
      }, 1000);
    }
  };
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitBtn.click(); });
}

function afterElimResolved(){
  const winner = checkWinCondition();
  if(winner){
    state.gameOverWinner = winner;
    launchConfetti();
    goTo('results');
    return;
  }
  state.round++;
  enterDiscussion();
}

function attachResultsHandlers(){
  const again = document.getElementById('btnPlayAgain');
  if(again) again.onclick = ()=>{ playAgain(); };
  const newSetup = document.getElementById('btnNewSetup');
  if(newSetup) newSetup.onclick = ()=>{ resetToSetup(); };
}

/* ============================================================
   Timer engine
   ============================================================ */
function startTimer(){
  state.timerRunning = true;
  clearInterval(state.timerHandle);
  saveState();
  state.timerHandle = setInterval(()=>{
    state.timerRemaining--;
    saveState();
    if(state.timerRemaining <= 10 && state.timerRemaining > 0){ beep(440,0.05,'sine',0.03); }
    if(state.timerRemaining <= 0){
      state.timerRemaining = 0;
      clearInterval(state.timerHandle);
      state.timerRunning = false;
      saveState();
      beep(300,0.3,'sawtooth',0.06); haptic([30,30,30]);
      if(state.timerKind === 'discussion'){ enterVoting(); return; }
    }
    updateTimerDisplay();
  }, 1000);
}
function pauseTimer(){ state.timerRunning=false; clearInterval(state.timerHandle); saveState(); }
function resumeTimer(){ startTimer(); }
function stopTimer(){ state.timerRunning=false; clearInterval(state.timerHandle); saveState(); }
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(el){
    el.textContent = fmtTime(state.timerRemaining);
    el.classList.toggle('low', state.timerRemaining<=10);
  }
}

/* ============================================================
   Confetti (canvas, no external assets)
   ============================================================ */
function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  ctx.scale(dpr,dpr);

  // Using the OKLCH theme colors approximately mapped to hex for simple canvas
  const colors = ['oklch(0.5854 0.2041 277.1173)', 'oklch(0.8687 0.0043 56.3660)', 'oklch(0.9376 0.0260 321.9388)', 'oklch(0.6368 0.2078 25.3313)'];
  const pieces = [];
  const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 90;
  for(let i=0;i<count;i++){
    pieces.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*200,
      w: 6+Math.random()*6,
      h: 8+Math.random()*10,
      color: colors[randInt(0,colors.length-1)],
      vy: 2+Math.random()*3,
      vx: -1.5+Math.random()*3,
      rot: Math.random()*360,
      vr: -6+Math.random()*12,
    });
  }
  let frame=0;
  const maxFrames = 260;
  function tick(){
    frame++;
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(frame < maxFrames && count>0){ requestAnimationFrame(tick); }
    else{ ctx.clearRect(0,0,window.innerWidth,window.innerHeight); }
  }
  if(count>0) tick();
}
window.addEventListener('resize', ()=>{
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = 0; canvas.height = 0;
});

/* ============================================================
   Escaping helpers
   ============================================================ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================
   Boot
   ============================================================ */
function init() {
  const savedTheme = localStorage.getItem('masque_theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
  
  loadNames();
  const hasState = loadState();
  if (hasState && state.screen !== 'setup') {
    if (state.timerRunning) {
      startTimer();
    }
  } else {
    state.screen = 'setup';
  }
  render();
}

init();

})();
</script>
