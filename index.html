<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>MASQUE — Undercover Party Game</title>
<meta name="description" content="A social deduction party game. Everyone wears a word. Someone's is different.">
<meta name="theme-color" content="#141B44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MASQUE">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 64'><path d='M6 26 C24 8 44 12 60 22 C76 12 96 8 114 26 C106 46 86 50 74 40 C68 36 52 36 46 40 C34 50 14 46 6 26 Z' fill='%23FFC531'/><ellipse cx='36' cy='25' rx='11' ry='7' fill='%23141B44'/><ellipse cx='84' cy='25' rx='11' ry='7' fill='%23141B44'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MASQUE — v3 final
   ============================================================ */
:root{
  --font-head:'Baloo 2',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
  --sky-1:#2A3572; --sky-2:#1A2254; --sky-3:#0D1233;
  --mtn-far:#1C2452; --mtn-near:#121A42;
  --ink:#F4F6FF; --ink-dim:rgba(228,234,255,.62);
  --paper:#FFFDF4; --paper-2:#F7EFDA; --paper-ink:#232C52; --paper-dim:#7A80A3;
  --line:rgba(255,255,255,.16); --chip:rgba(255,255,255,.09);
  --gold:#FFC531; --gold-deep:#E0A51D; --gold-ink:#4A3305;
  --coral:#FF6B5E; --coral-deep:#CE4538;
  --paper-edge:#E1D8BF;
  --shadow-panel:0 10px 26px rgba(6,10,30,.38);
  --pop:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.22,1,.36,1);
}
[data-theme="day"]{
  --sky-1:#FFEFCA; --sky-2:#FFE2A8; --sky-3:#F9D690;
  --mtn-far:#EBCB95; --mtn-near:#DDB276;
  --ink:#2A3153; --ink-dim:rgba(42,49,83,.62);
  --paper:#FFFFFF; --paper-2:#FBF3DE; --paper-ink:#2A3153; --paper-dim:#8A90AC;
  --line:rgba(42,49,83,.18); --chip:rgba(255,255,255,.55);
  --paper-edge:#EAE2CC;
  --shadow-panel:0 10px 22px rgba(160,120,50,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
html,body{min-height:100%;}
body{
  background:#0D1233;
  color:var(--ink);
  font-family:var(--font-body);
  overflow-x:hidden;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
button{font-family:inherit;touch-action:manipulation;}
::selection{background:var(--gold);color:var(--gold-ink);}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

/* ---------- The world ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%);}
.star{position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--tw,3s) ease-in-out var(--twd,0s) infinite;}
.moon{position:absolute;top:9%;right:14%;width:58px;height:58px;border-radius:50%;
  background:#F4E9C8;
  box-shadow:0 0 30px 5px rgba(244,233,200,.3), inset -12px -8px 0 rgba(140,120,60,.18);}
.sun{display:none;position:absolute;top:8%;left:12%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%, #FFF6C9, #FFD54A);
  animation:glow 4.5s ease-in-out infinite;}
.cloud{display:none;position:absolute;width:130px;opacity:.85;animation:drift 14s ease-in-out infinite alternate;}
.cloud.c1{top:14%;right:8%;}
.cloud.c2{top:30%;left:4%;width:90px;animation-duration:19s;}
.mtns{position:absolute;bottom:-2px;left:0;width:100%;height:22vh;min-height:140px;}
.mtns .mf{fill:var(--mtn-far);}
.mtns .mn{fill:var(--mtn-near);}
.sstar{position:absolute;width:110px;height:2px;border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0), #fff);
  transform:rotate(-32deg);animation:shoot 1.15s ease-out forwards;}
[data-theme="day"] .star,[data-theme="day"] .moon,[data-theme="day"] .sstar{display:none;}
[data-theme="day"] .sun,[data-theme="day"] .cloud{display:block;}

/* ---------- App shell ---------- */
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
.screen{flex:1;display:flex;flex-direction:column;padding:6px 20px 22px;}
.screen.enter{animation:screenIn .45s var(--soft) both;}
.screen-foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px;}
.screen-foot.sticky{position:sticky;bottom:0;padding:16px 0 8px;
  background:linear-gradient(180deg, transparent, var(--sky-2) 42%);}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
.tb-right{display:flex;gap:8px;}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--chip);
  border:1.5px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s var(--pop), background .2s;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.icon-btn:active{transform:scale(.88);}
.icon-btn .ic{width:19px;height:19px;}
.icon-btn.dark{background:var(--paper-2);color:var(--paper-ink);border-color:#E4DBC4;}
.round-pill{font-family:var(--font-head);font-weight:800;font-size:.78rem;letter-spacing:.1em;
  padding:10px 16px;border-radius:999px;background:var(--chip);border:1.5px solid var(--line);color:var(--ink);}
.brandmark{width:42px;height:42px;border-radius:14px;background:var(--chip);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;padding:9px;}
.brandmark svg{width:100%;}

/* ---------- Type ---------- */
.scr-head{padding:6px 0 18px;}
.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:900;color:var(--ink-dim);margin-bottom:8px;}
.eyebrow.center{text-align:center;}
.scr-title{font-family:var(--font-head);font-weight:800;font-size:1.8rem;line-height:1.12;color:var(--ink);letter-spacing:.01em;}
.scr-sub{color:var(--ink-dim);font-size:.93rem;line-height:1.55;margin-top:7px;max-width:44ch;}
.scr-sub.center{margin:7px auto 0;}

/* ---------- Buttons ---------- */
.btn{font-family:var(--font-head);font-weight:700;font-size:1.02rem;letter-spacing:.01em;border:none;
  border-radius:18px;padding:16px 22px;display:flex;align-items:center;justify-content:center;gap:9px;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  transition:transform .12s ease, box-shadow .12s ease, opacity .2s;min-width:0;}
.btn .ic{width:20px;height:20px;flex-shrink:0;}
.btn:active:not(:disabled){transform:translateY(4px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sun{background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-deep);}
.btn-sun:active:not(:disabled){box-shadow:0 1px 0 var(--gold-deep);}
.btn-shot{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep);}
.btn-shot:active:not(:disabled){box-shadow:0 1px 0 var(--coral-deep);}
.btn-paper{background:var(--paper);color:var(--paper-ink);box-shadow:0 5px 0 var(--paper-edge);}
.btn-paper:active:not(:disabled){box-shadow:0 1px 0 var(--paper-edge);}
.btn-ghost{background:var(--chip);border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost:active:not(:disabled){transform:translateY(2px);}
.btn-danger{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep);margin-top:16px;}
.btn-danger:active:not(:disabled){box-shadow:0 1px 0 var(--coral-deep);}
.btn-big{padding:18px 24px;font-size:1.15rem;}
.btn-sm{padding:10px 14px;font-size:.85rem;border-radius:14px;}
.btn-block{width:100%;}
#fireLabel{min-width:0;max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- Paper panels ---------- */
.panel{background:var(--paper);border-radius:22px;padding:16px 16px 18px;
  box-shadow:var(--shadow-panel);color:var(--paper-ink);margin-bottom:14px;}
.panel-label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:900;
  color:var(--paper-dim);margin-bottom:12px;}
.divider{height:1.5px;background:#EDE5CE;margin:14px -4px;}
.set-sec{display:flex;align-items:center;gap:12px;}
.set-head{flex:1;display:flex;align-items:center;gap:12px;min-width:0;}
.set-ico{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.icw{background:var(--paper-2);border-radius:14px;color:var(--paper-ink);}
.icw .ic{width:20px;height:20px;}
.set-name{font-weight:800;font-size:.98rem;display:block;}
.set-hint{font-size:.74rem;color:var(--paper-dim);margin-top:2px;display:block;line-height:1.4;}
.av-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.av-more{width:30px;height:30px;border-radius:50%;background:var(--paper-2);color:var(--paper-dim);
  font-size:.62rem;font-weight:900;display:flex;align-items:center;justify-content:center;}
.stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.st-btn{width:44px;height:44px;border-radius:16px;background:var(--paper-2);color:var(--paper-ink);
  border:none;font-size:1.5rem;font-family:var(--font-head);font-weight:700;line-height:1;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.1);transition:transform .12s, box-shadow .12s;user-select:none;-webkit-user-select:none;}
.st-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1);}
.st-btn:disabled{opacity:.28;cursor:not-allowed;}
.st-val{font-family:var(--font-head);font-weight:800;font-size:1.5rem;min-width:44px;text-align:center;
  color:var(--paper-ink);font-variant-numeric:tabular-nums;}
.names-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.name-row{display:flex;align-items:center;gap:10px;background:var(--paper-2);border-radius:14px;padding:8px 12px;}
.nnum{font-family:var(--font-head);font-weight:800;color:var(--paper-dim);width:14px;font-size:.8rem;flex-shrink:0;}
.name-row input{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:16px;
  font-weight:700;color:var(--paper-ink);}
.name-row input:focus{outline:none;}
.name-row input::placeholder{color:var(--paper-dim);opacity:.7;}
.validation{display:flex;align-items:center;gap:8px;background:var(--paper);color:#D94436;
  border:2px solid #FFB4AC;border-radius:18px;padding:12px 16px;font-weight:800;font-size:.85rem;
  margin-bottom:14px;animation:shake .4s;}
.validation .ic{width:16px;height:16px;flex-shrink:0;}

/* ---------- Switch ---------- */
.switch{position:relative;width:52px;height:30px;flex-shrink:0;display:inline-block;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;border-radius:999px;background:#E4DECB;transition:.25s;cursor:pointer;}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.25s var(--pop);}
.switch input:checked + .track{background:var(--gold);}
.switch input:checked + .track::after{transform:translateX(22px);}

/* ---------- Home ---------- */
.home{flex:1;display:flex;flex-direction:column;padding-bottom:8px;}
.home-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  position:relative;min-height:0;padding:10px 0 16px;}
.mascot-float{width:min(48vw,200px);animation:floaty 4s ease-in-out infinite;}
.mascot-float .spy{width:100%;}
.logo{display:flex;align-items:flex-end;justify-content:center;gap:1px;font-family:var(--font-head);
  font-weight:800;font-size:clamp(2.8rem,13.5vw,3.7rem);color:#fff;line-height:1;margin-top:8px;
  text-shadow:0 5px 0 rgba(9,13,36,.4);}
.logo .lt{position:relative;display:inline-block;transform:rotate(var(--r,0deg));}
.logo-hat{position:absolute;top:-.58em;left:50%;width:1.06em;transform:translateX(-50%) rotate(-7deg);}
.tagline{font-size:.74rem;font-weight:900;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);margin-top:12px;}
.laurel-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 22px;}
.laurel-banner .laurel svg{width:36px;}
.lb-text{text-align:center;}
.lb-stars{display:flex;gap:3px;justify-content:center;margin-bottom:4px;}
.lb-stars svg{width:13px;height:13px;fill:var(--gold);}
.lb-line{font-size:.66rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);}
.home-foot{display:flex;flex-direction:column;gap:11px;padding-bottom:4px;}
.home-note{text-align:center;font-size:.7rem;color:var(--ink-dim);padding-top:4px;letter-spacing:.04em;}
.sparkle{position:absolute;color:var(--gold);opacity:.9;animation:twinkle 2.6s ease-in-out infinite;}
.sparkle svg{width:100%;height:100%;fill:currentColor;}
.s1{width:22px;left:12%;top:18%;animation-delay:.4s;}
.s2{width:14px;right:14%;top:30%;animation-delay:1.3s;}
.s3{width:11px;right:22%;top:8%;animation-delay:2s;}
.laurel svg{width:42px;height:auto;display:block;}
.laurel.flip{transform:scaleX(-1);}

/* ---------- Dealing ---------- */
.pass-head{text-align:center;padding:4px 0 18px;}
.pass-av{width:74px;margin:0 auto 12px;animation:popIn .35s var(--pop) both;}
.pass-name{font-family:var(--font-head);font-weight:800;font-size:1.7rem;color:var(--ink);overflow-wrap:anywhere;}
.pass-sub{color:var(--ink-dim);font-size:.88rem;margin-top:5px;}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding-top:4px;}
.whocard{background:var(--chip);border:1.5px solid var(--line);border-radius:20px;padding:16px 8px 13px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--ink);
  transition:transform .15s var(--pop), background .15s;user-select:none;-webkit-user-select:none;
  animation:popIn .3s var(--pop) both;}
.whocard:active{transform:scale(.93);}
.whocard .wname{font-weight:800;font-size:.84rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:11px;padding-top:6px;}
.pcard{position:relative;aspect-ratio:3/4.05;border:none;background:none;padding:0;cursor:pointer;
  user-select:none;-webkit-user-select:none;animation:popIn .3s var(--pop) both;}
.pcard .cback{position:absolute;inset:0;border-radius:15px;
  background:linear-gradient(165deg,#2C3770,#19204B);border:2px solid rgba(255,255,255,.15);
  box-shadow:0 5px 0 rgba(4,7,22,.45);display:flex;align-items:center;justify-content:center;
  transition:transform .12s, box-shadow .12s;}
.pcard .cback svg{width:64%;}
.pcard:active:not(:disabled) .cback{transform:translateY(3px);box-shadow:0 2px 0 rgba(4,7,22,.45);}
.pcard.taken{cursor:default;}
.pcard.taken .cback{opacity:.45;}
.pcard .took{position:absolute;inset:0;border-radius:15px;background:rgba(10,14,38,.66);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;}
.pcard .took .tname{font-size:.58rem;font-weight:800;max-width:92%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;opacity:.85;}
.tkchk{width:15px;height:15px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;}
.tkchk svg{width:9px;height:9px;}
.pick-meta{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;color:var(--ink-dim);
  font-size:.75rem;font-weight:800;letter-spacing:.06em;white-space:nowrap;}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--chip);overflow:hidden;border:1px solid var(--line);}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .45s var(--soft);}

/* ---------- Peek overlay ---------- */
.peek{position:fixed;inset:0;z-index:150;background:rgba(7,10,28,.88);
  display:flex;align-items:center;justify-content:center;padding:22px;animation:fadeIn .22s ease both;
  touch-action:none;overscroll-behavior:contain;}
.peek-inner{width:100%;max-width:290px;display:flex;flex-direction:column;align-items:center;gap:20px;
  animation:popIn .32s var(--pop) both;}
.peek-label{font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);text-align:center;}
.bigcard{width:100%;aspect-ratio:3/4.15;perspective:1100px;}
.flipper{width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.3,1.3,.45,1);will-change:transform;}
.peek.flipped .flipper{transform:rotateY(180deg);}
.bface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px 22px;}
.bface.back{background:linear-gradient(165deg,#2C3770,#19204B);border:2px solid rgba(255,255,255,.16);
  box-shadow:0 10px 0 rgba(4,7,22,.5);cursor:pointer;}
.bface.back::before{content:'';position:absolute;inset:11px;border-radius:18px;border:2px dashed rgba(255,255,255,.13);}
.bface.back .mask-em{width:62%;}
.bface.back .tap{font-family:var(--font-head);font-weight:700;font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.72);animation:wob 2.4s ease-in-out infinite;}
.peek.flipped .bface.back{pointer-events:none;}
.bface.front{transform:rotateY(180deg);background:var(--paper);color:var(--paper-ink);
  box-shadow:0 10px 0 var(--paper-edge);}
.peek-kicker{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:900;color:var(--paper-dim);}
.fword{font-family:var(--font-head);font-weight:800;font-size:clamp(1.9rem,9vw,2.5rem);text-align:center;line-height:1.08;overflow-wrap:anywhere;}
.bface.front.blank .fword{font-size:1.45rem;}
.fhint{font-size:.82rem;color:var(--paper-dim);text-align:center;line-height:1.45;max-width:24ch;}
.pk-btns{width:100%;}
.peek .pk-after{display:none;}
.peek.flipped .pk-after{display:flex;}
.peek.flipped .pk-before{display:none;}
.pk-btns .btn{width:100%;}

/* ---------- Round screen ---------- */
.order-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.ord{width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;
  animation:popIn .3s var(--pop) both;}
.ord-i{position:absolute;top:-6px;left:-5px;width:19px;height:19px;border-radius:50%;background:var(--paper-2);
  color:var(--paper-dim);font-size:.62rem;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #E4DBC4;z-index:1;}
.ord-nm{font-size:.66rem;font-weight:800;color:var(--paper-ink);max-width:58px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.ord.first .av{border-radius:50%;box-shadow:0 0 0 3.5px var(--gold);}
.order-note{margin-top:14px;font-size:.8rem;font-weight:800;color:var(--paper-dim);text-align:center;}

/* ---------- Voting ---------- */
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding-top:4px;}
.vote-grid.locked{pointer-events:none;}
.vcard{position:relative;background:var(--paper);color:var(--paper-ink);border:none;border-radius:20px;
  padding:14px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  box-shadow:0 4px 0 rgba(4,7,22,.35);transform:rotate(var(--tilt,0deg));
  transition:transform .18s var(--pop), box-shadow .18s, opacity .2s;
  user-select:none;-webkit-user-select:none;animation:popIn .3s var(--pop) both;}
.vcard .vno{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);}

<script>
(function(){
"use strict";

/* ============================================================
   Word pairs — 51 hand-picked pairs.
   Rule: same conceptual world, different KIND of thing, so
   clues overlap richly but the undercover can't auto-detect.
   ============================================================ */
const PAIRS=[
["Beach","Swimming pool"],["Zoo","Circus"],["Wedding","Funeral"],
["Batman","Superman"],["Zombie","Sleepwalker"],["Astronaut","Scuba diver"],
["Santa Claus","Tooth fairy"],["Elevator","Escalator"],["Aquarium","Television"],
["Cactus","Hedgehog"],["Rainbow","Peacock"],["Snowman","Scarecrow"],
["Helicopter","Dragonfly"],["Submarine","Whale"],["Pirate","Cowboy"],
["Wizard","Chef"],["Toilet","Throne"],["Sunflower","Satellite dish"],
["Rooster","Alarm clock"],["Bridge","Tunnel"],["Dentist","Vampire"],
["Firefighter","Dragon"],["Mirror","Twin"],["Dog","Shadow"],
["Ice cream","Candle"],["Wi-Fi","Ghost"],["Pizza","Moon"],
["Doctor","Mechanic"],["Teacher","Zookeeper"],["Traffic light","Christmas tree"],
["Drum","Thunder"],["Jellyfish","Lava lamp"],["Penguin","Butler"],
["Kangaroo","Taxi"],["Cat","Ninja"],["Waiter","Juggler"],
["Popcorn","Fireworks"],["Cloud","Cotton candy"],["Umbrella","Bodyguard"],
["Volcano","Teapot"],["Hammock","Banana"],["Colosseum","Football stadium"],
["Chameleon","Actor"],["Parrot","Echo"],["Refrigerator","Museum"],
["Vending machine","Slot machine"],["Stork","Postman"],["Bee","Office worker"],
["Owl","Librarian"],["Lightning","Photographer"],["Bathtub","Soup"]
];

/* ============================================================
   Utilities
   ============================================================ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function defaultNames(n){const out=[];for(let i=1;i<=n;i++)out.push('Player '+i);return out;}

/* ============================================================
   State
   ============================================================ */
function getInitialState(){
  return {
    screen:'home',
    setup:{
      playerCount:6, undercoverCount:1, mrWhiteCount:1,
      useNames:false, names:defaultNames(6), revealRoles:false
    },
    settings:{ sound:true, haptic:true, ambience:true, theme:'night' },
    players:[], wordPair:null,
    discussionOrder:[],
    round:1,
    pick:{ phase:'who', who:null, chosen:null, flipped:false, cards:[] },
    voteSel:null, eliminationResult:null, gameOverWinner:null,
    guessLock:false, firing:false,
    sheet:null
  };
}
const state = getInitialState();

function saveState(){
  const {screen,setup,settings,players,wordPair,discussionOrder,round,pick,voteSel,eliminationResult,gameOverWinner} = state;
  try{ localStorage.setItem('masque2_state', JSON.stringify({screen,setup,settings,players,wordPair,discussionOrder,round,pick,voteSel,eliminationResult,gameOverWinner})); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('masque2_state'); if(!raw) return false;
    const d = JSON.parse(raw); if(!d || typeof d!=='object') return false;
    const fresh = getInitialState();
    state.setup = Object.assign(fresh.setup, d.setup||{});
    delete state.setup.category; delete state.setup.discussionSeconds; delete state.setup.votingSeconds;
    state.settings = Object.assign(fresh.settings, d.settings||{});
    ['screen','players','wordPair','discussionOrder','round','voteSel','eliminationResult','gameOverWinner'].forEach(k=>{
      if(d[k]!==undefined) state[k]=d[k];
    });
    if(!Array.isArray(state.players)) state.players=[];
    if(!Array.isArray(state.discussionOrder)) state.discussionOrder=[];
    if(state.screen==='discussion'||state.screen==='ready') state.screen='round';
    if(!SCREENS[state.screen]) state.screen='home';
    if(state.screen!=='home' && state.screen!=='lobby' && state.players.length===0) state.screen='home';
    const n=state.players.length;
    let cards=null;
    if(d.pick && Array.isArray(d.pick.cards)) cards=d.pick.cards.slice();
    else if(d.pick && Array.isArray(d.pick.taken)) cards=d.pick.taken.slice();
    if(cards){
      while(cards.length<n)cards.push(null);
      cards=cards.slice(0,n).map(c=>(c!=null && c>=0 && c<n)?c:null);
      state.pick={phase:(d.pick.phase==='choose'||d.pick.phase==='who')?d.pick.phase:'who',
        who:(typeof d.pick.who==='number'&&d.pick.who>=0&&d.pick.who<n)?d.pick.who:null,
        chosen:null,flipped:false,cards:cards};
      if(state.pick.phase==='choose'&&state.pick.who==null)state.pick.phase='who';
    }else{
      state.pick={phase:'who',who:null,chosen:null,flipped:false,cards:state.players.map(()=>null)};
    }
    if(state.voteSel!=null){
      const p=state.players.find(x=>x.id===state.voteSel);
      if(!p||!p.alive) state.voteSel=null;
    }
    state.sheet=null; state.firing=false; state.guessLock=false;
    return true;
  }catch(e){ return false; }
}
function saveNames(){ try{ localStorage.setItem('masque2_names', JSON.stringify(state.setup.names)); }catch(e){} }
function loadNames(){
  try{
    const s = localStorage.getItem('masque2_names');
    if(s){ const p = JSON.parse(s); if(Array.isArray(p)) state.setup.names = p; }
  }catch(e){}
}
function byId(id){ return state.players.find(p=>p.id===id); }
function applyTheme(){
  const t = state.settings.theme==='day'?'day':'night';
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = t==='day' ? '#FFEFC9' : '#141B44';
}

/* ============================================================
   Sound engine — all synthesized, routed through one
   compressor so layered sounds stay punchy without clipping.
   ============================================================ */
let audioCtx=null, master=null;
function ac(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function out(){
  const c=ac(); if(!c) return null;
  if(!master){
    master=c.createGain(); master.gain.value=.9;
    const comp=c.createDynamicsCompressor();
    master.connect(comp); comp.connect(c.destination);
  }
  return master;
}
function tone(freq,dur,type,vol,delay){
  if(!state.settings.sound) return;
  const c=ac(), m=out(); if(!c||!m) return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol||.06,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(m);
  o.start(t); o.stop(t+dur+.03);
}
function sweep(f1,f2,dur,vol,delay){
  if(!state.settings.sound) return;
  const c=ac(), m=out(); if(!c||!m) return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||.07,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(m);
  o.start(t); o.stop(t+dur+.03);
}
let NOISE=null;
function noiseBuf(){
  const c=ac(); if(!c) return null;
  if(NOISE) return NOISE;
  const len=c.sampleRate;
  NOISE=c.createBuffer(1,len,c.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return NOISE;
}
function playNoise(dur,type,freq,vol,delay,freqEnd){
  if(!state.settings.sound) return;
  const c=ac(), m=out(); if(!c||!m) return;
  const buf=noiseBuf(); if(!buf) return;
  const t=c.currentTime+(delay||0);
  const src=c.createBufferSource();
  src.buffer=buf; src.loop=true;
  src.playbackRate.value=.9+Math.random()*.2;
  const f=c.createBiquadFilter();
  f.type=type; f.frequency.setValueAtTime(freq,t);
  if(freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd),t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(m);
  src.start(t); src.stop(t+dur+.02);
}

   Confetti / blood bursts
   ============================================================ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const confetti=(function(){
  const cv=document.getElementById('confetti-canvas');
  const ctx=cv.getContext('2d');
  let parts=[],raf=null;
  function rs(){cv.width=innerWidth;cv.height=innerHeight;}
  addEventListener('resize',rs);rs();
  function burst(x,y,ang,spread,n,pow,colors){
    if(REDUCED)return;
    for(let i=0;i<n;i++){
      const a=(ang+(Math.random()-.5)*spread)*Math.PI/180;
      const v=pow*(.5+Math.random()*.8);
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.16+Math.random()*.08,
        rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:5+Math.random()*6,h:4+Math.random()*5,
        c:colors[(Math.random()*colors.length)|0],sh:Math.random()<.35?'c':'r',life:140+Math.random()*60});
    }
    if(!raf)raf=requestAnimationFrame(loop);
  }
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
    for(const p of parts){
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.rot+=p.vr;p.life--;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life/40);
      if(p.sh==='c'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,7);ctx.fill();}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(parts.length)raf=requestAnimationFrame(loop);
    else{raf=null;ctx.clearRect(0,0,cv.width,cv.height);}
  }
  return {
    cannons(colors){
      const W=cv.width,H=cv.height;
      burst(10,H*.85,-65,55,70,16,colors);
      burst(W-10,H*.85,-115,55,70,16,colors);
    },
    pop(colors){
      burst(cv.width/2,cv.height*.32,-90,360,46,9,colors||['#FFC531','#FFE08A','#FFFFFF']);
    },
    splat(x,y){
      burst(x,y,-90,320,26,7.5,['#D63A2F','#B02A22','#FF7A6B']);
      burst(x,y,-90,360,10,3.2,['#8E1F18','#B02A22']);
    }
  };
})();

  if(s.playerCount>20)e.push('Maximum is 20 players.');
  if(civ<1)e.push('Leave at least one innocent Civilian in the game.');
  if(s.undercoverCount+s.mrWhiteCount===0)e.push('Add at least one Undercover or Mr. White — someone has to lie.');
  if(s.undercoverCount>=civ)e.push('Undercover can’t match or outnumber the civilians at the start.');
  return e;
}
function setPlayerCount(d){
  const s=state.setup;
  s.playerCount=Math.min(20,Math.max(3,s.playerCount+d));
  while(s.names.length<s.playerCount)s.names.push('Player '+(s.names.length+1));
  while(s.undercoverCount+s.mrWhiteCount>=s.playerCount){
    if(s.mrWhiteCount>0)s.mrWhiteCount--;else s.undercoverCount--;
  }
  persistRender();
}
function setRoleCount(key,d){
  const s=state.setup;
  const other=key==='undercoverCount'?s.mrWhiteCount:s.undercoverCount;
  const max=s.playerCount-other-1;
  s[key]=Math.max(0,Math.min(max,s[key]+d));
  persistRender();
}
function startGame(){
  const s=state.setup;
  const pair=PAIRS[randInt(0,PAIRS.length-1)];
  const civWord=Math.random()<.5?pair[0]:pair[1];
  const underWord=civWord===pair[0]?pair[1]:pair[0];
  state.wordPair={civ:civWord,under:underWord};
  /* defensive name fill (older saved name lists may be short) */
  const names=[];
  for(let i=0;i<s.playerCount;i++){
    const raw=s.useNames?s.names[i]:null;
    names.push(raw&&raw.trim()?raw.trim():'Player '+(i+1));
  }
  const roles=[];
  for(let i=0;i<s.undercoverCount;i++)roles.push('undercover');
  for(let i=0;i<s.mrWhiteCount;i++)roles.push('mrwhite');
  while(roles.length<s.playerCount)roles.push('civilian');
  const sh=shuffle(roles);
  state.players=names.map((n,i)=>({id:i,name:n,role:sh[i],
    word:sh[i]==='civilian'?civWord:sh[i]==='undercover'?underWord:null,alive:true}));
  state.round=1;
  state.discussionOrder=shuffle(state.players.map(p=>p.id));
  state.voteSel=null;state.eliminationResult=null;state.gameOverWinner=null;
  state.guessLock=false;state.firing=false;
  state.pick={phase:'who',who:null,chosen:null,flipped:false,cards:state.players.map(()=>null)};
  closeSheet();
  sfx.deal();
  goTo('pick');
}
/* Win conditions — checked after every elimination and after the
   Mr. White guess resolves:
   - civilians win only when ALL undercover AND Mr. White are gone
   - undercover wins the moment undercover >= civilians (parity)
   - Mr. White wins instantly with a correct guess (handled in submitGuess) */
function checkWin(){
  const alive=state.players.filter(p=>p.alive);
  const civ=alive.filter(p=>p.role==='civilian').length;
  const under=alive.filter(p=>p.role==='undercover').length;
  const white=alive.filter(p=>p.role==='mrwhite').length;
  if(under===0&&white===0)return 'civilians';
  if(under>=civ)return 'infiltrators';
  return null;
}
function nextRound(){
  state.round++;
  state.eliminationResult=null;
  state.discussionOrder=shuffle(state.players.filter(p=>p.alive).map(p=>p.id));
  goTo('round');
}

/* ---------- Dealing: anyone can claim the phone ---------- */
function pickWho(id){
  const p=byId(id); if(!p)return;
  state.pick.who=id; state.pick.phase='choose';
  haptic(10);
  persistRender();
}
function pickCard(i){
  if(state.pick.cards[i]!=null)return;
  state.pick.phase='peek';state.pick.chosen=i;state.pick.flipped=false;
  sfx.card();haptic(12);
  saveState();render();
}
function hideCard(){
  const pk=state.pick;
  pk.cards[pk.chosen]=pk.who;
  const done=pk.cards.every(c=>c!=null);
  pk.chosen=null;pk.flipped=false;pk.who=null;pk.phase='who';
  haptic([20,40,20]);
  if(done){sfx.good();goTo('round');}
  else{sfx.pass();persistRender();}
}

/* ---------- The shot ---------- */
function fire(){
  if(state.voteSel==null||state.firing)return;
  state.firing=true;
  const p=byId(state.voteSel);
  const card=document.querySelector('.vcard.sel');
  const grid=document.getElementById('voteGrid');
  const btn=document.getElementById('fireBtn');
  if(grid)grid.classList.add('locked');
  if(btn)btn.disabled=true;
  haptic([30,40,110]);
  sfx.aim();
  if(card)card.classList.add('aim');
  setTimeout(()=>{
    shotSound();haptic(120);
    const flash=document.createElement('div');
    flash.className='flash';
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(),650);
    const appEl=document.getElementById('app');
    if(appEl){
      appEl.classList.remove('shake-shot');void appEl.offsetWidth;
      appEl.classList.add('shake-shot');
      setTimeout(()=>appEl.classList.remove('shake-shot'),600);
    }
    if(grid)grid.classList.add('recoil');
    if(card){
      const r=card.getBoundingClientRect();
      confetti.splat(r.left+r.width/2, r.top+r.height/2);
      splatSound();
      card.classList.add('shot');
    }
  },420);
  setTimeout(()=>{
    p.alive=false;
    state.eliminationResult={playerId:p.id,role:p.role};
    state.voteSel=null;state.firing=false;
    saveState();
    goTo('voteout');
    sfx.voteout();
  },1400);
}
function afterVoteout(){
  const r=state.eliminationResult;
  if(!r)return;
  if(r.role==='mrwhite'){goTo('whiteGuess');return;}
  const w=checkWin();
  if(w){
    state.gameOverWinner=w;
    goTo('results');
    confetti.cannons(w==='civilians'?PAL_GOLD:PAL_CORAL);
    sfx.tada();
    return;
  }
  nextRound();
}
function submitGuess(){
  if(state.guessLock)return;
  const inp=document.getElementById('guessInput');
  if(!inp)return;
  const v=inp.value.trim().toLowerCase();
  if(!v)return;
  state.guessLock=true;
  const ok=v===String(state.wordPair.civ).trim().toLowerCase();
  if(ok){
    inp.classList.add('right');
    state.gameOverWinner='mrwhite';
    sfx.tada();haptic([20,40,20,40,60]);
    setTimeout(()=>{
      state.guessLock=false;
      goTo('results');
      confetti.cannons(PAL_SILVER);
    },900);
  }else{
    inp.classList.add('wrong');
    sfx.bad();haptic(120);
    setTimeout(()=>{
      state.guessLock=false;
      /* a wrong guess does NOT end the game — check conditions normally */
      const w=checkWin();
      if(w){
        state.gameOverWinner=w;
        goTo('results');
        confetti.cannons(PAL_GOLD);
        sfx.tada();
      }else{
        nextRound();
        toast('Wrong guess — the game goes on!');
      }
    },1100);
  }
}

/* ---------- Results ---------- */
function twoSpies(){
  return '<div class="duo-spy">'+spySVG({pose:'peace',skin:SKINS[0],tie:'#FF5D5D'})
    +spySVG({pose:'peace',skin:SKINS[2],tie:'#4DA3FF',band:'#FF6B5E'})+'</div>';
}
function renderResults(){
  const w=state.gameOverWinner||'civilians';
  const M={
    civilians:{c:'#8FC3FF',title:'CIVILIANS WIN!',line:'Every infiltrator, unmasked. Beautifully done.'},
    infiltrators:{c:'#FF9A8E',title:'UNDERCOVER WINS!',line:'They matched the civilians — and out-bluffed them all.'},
    mrwhite:{c:'#FFFFFF',title:'MR. WHITE WINS!',line:'Guessed blind. Nailed it. Unbelievable.'}
  }[w];
  const art=w==='civilians'?twoSpies()
    :w==='mrwhite'?'<div class="one-spy">'+spySVG({pose:'peace',monocle:true,tie:'#8B93B8',band:'#E9EDF7',skin:SKINS[3]})+'</div>'
    :'<div class="one-spy">'+spySVG({pose:'point',mask:true,tie:'#FF6B5E',band:'#FF6B5E'})+'</div>';
  const hadWhite=state.players.some(p=>p.role==='mrwhite');
  const civ=state.wordPair?state.wordPair.civ:'—';
  const und=state.wordPair?state.wordPair.under:'—';
  return '<div class="win-hero">'
  +'<div class="win-stars">'+STAR.repeat(5)+'</div>'
  +'<div class="win-wrap">'+laurelBranch(false)
    +'<div class="win-mid"><h1 class="win-title" style="--win-c:'+M.c+'">'+M.title+'</h1><p class="win-sub">'+M.line+'</p></div>'
  +laurelBranch(true)+'</div>'
  +art
  +'</div>'
  +'<div class="panel"><div class="panel-label">The words</div><div class="duo">'
    +'<div class="wcard"><span class="role-chip civ">Civilians</span><div class="wword">“'+esc(civ)+'”</div></div>'
    +'<div class="wcard"><span class="role-chip under">Undercover</span><div class="wword">“'+esc(und)+'”</div></div>'
  +'</div>'+(hadWhite?'<div class="wfoot">Mr. White never had a word — and still almost won.</div>':'')+'</div>'
  +'<div class="panel"><div class="panel-label">The table</div>'
    +state.players.map(p=>'<div class="rrow'+(p.alive?'':' out')+'">'
      +'<span class="rav">'+avatarSVG(p,42,null,p.alive?null:{blood:true})+'</span>'
      +'<span class="rmain"><span class="rname">'+esc(p.name)+(p.alive?'':'<span class="outtag">OUT</span>')+'</span>'
      +'<span class="rword">'+(p.word?'“'+esc(p.word)+'”':'no word')+'</span></span>'
      +'<span class="role-chip '+roleClass(p.role)+'">'+roleLabel(p.role)+'</span></div>').join('')
  +'</div>'
  +'<div class="screen-foot">'
    +'<button class="btn btn-sun btn-big" data-action="play-again">'+icon('cards')+'Play again</button>'
    +'<button class="btn btn-ghost" data-action="go-home">'+icon('home')+'Home</button>'
  +'</div>';
}

const SCREENS={
  home:renderHome, lobby:renderLobby, pick:renderPick, round:renderRound,
  voting:renderVoting, voteout:renderVoteout, whiteGuess:renderWhiteGuess, results:renderResults
};

function render(){
  const changed=lastScreen!==state.screen;
  lastScreen=state.screen;
  const fn=SCREENS[state.screen]||renderHome;
  app.innerHTML=topbarHtml()
    +'<main class="screen'+(changed?' enter':'')+'" id="screenRoot">'+fn()+'</main>';
  if(state.screen==='whiteGuess'){
    const gi=document.getElementById('guessInput');
    if(gi)setTimeout(()=>gi.focus(),350);
  }
}
function goTo(screen){state.screen=screen;saveState();render();}
function persistRender(){saveState();render();}

/* ============================================================
   Sheets — mounted OUTSIDE the app so opening them never
   re-renders the game DOM.
   ============================================================ */
let sheetHost=null;
function sheetInner(){
  const kind=state.sheet;
  if(kind==='rules'){
    return '<div class="sheet"><div class="grabber"></div>'
    +'<div class="sh-head"><div class="sh-title">How to play</div>'
    +'<button class="icon-btn dark" data-action="close-sheet" aria-label="Close">'+icon('x')+'</button></div>'
    +'<ol class="steps">'
      +'<li><b>Deal.</b> Pass the phone around — each player taps their own name and picks a card. Most players share the same secret word; the <span class="t-under">Undercover</span> gets a sneaky near-twin — and won’t know it.</li>'
      +'<li><b>Mr. White</b> gets no word at all. Pure improvisation — and one guess to steal the game.</li>'
      +'<li><b>Discuss.</b> One clue each, in the order shown. No timers — talk until it feels right.</li>'
      +'<li><b>Vote.</b> The table agrees on the shadiest player and takes the shot.</li>'
      +'<li><b>Win.</b> Civilians win only when <b>every Undercover and Mr. White</b> is eliminated. Undercover wins the moment they equal the civilians in number. Mr. White wins instantly with a correct guess. Voted-out identities stay secret — unless you switch on reveals.</li>'
    +'</ol>'
    +'<div class="role-cards">'
      +'<div class="rcard">'+avatarSVG(null,44,'civ')+'<b>Civilian</b><span>Knows the true word. Hunts the fakes.</span></div>'
      +'<div class="rcard">'+avatarSVG(null,44,'under')+'<b>Undercover</b><span>A near-miss word. Blends in.</span></div>'
      +'<div class="rcard">'+avatarSVG(null,44,'mrwhite')+'<b>Mr. White</b><span>No word. One guess to win it all.</span></div>'
    +'</div></div>';
  }
  const inGame=!['home','lobby','results'].includes(state.screen);
  const hasSW=swActive;
  const swRow=hasSW
    ?'<div class="srow static"><span class="s-ic ok">'+icon('offline')+'</span>'
      +'<span class="s-name">Offline mode<small class="sw-ok">Active — works without internet</small></span></div>'
    :'<div class="srow static"><span class="s-ic">'+icon('offline')+'</span>'
      +'<span class="s-name">Offline mode<small>Save sw.js next to index.html on your site, reload once, and the game works offline for everyone.</small></span>'
      +'<button class="btn btn-paper btn-sm" data-action="save-sw">'+icon('download')+'sw.js</button></div>';
  return '<div class="sheet"><div class="grabber"></div>'
  +'<div class="sh-head"><div class="sh-title">Settings</div>'
  +'<button class="icon-btn dark" data-action="close-sheet" aria-label="Close">'+icon('x')+'</button></div>'
  +'<label class="srow"><span class="s-ic">'+icon('volume')+'</span>'
    +'<span class="s-name">Sound effects<small>Flips, chips and gunshots</small></span>'
    +'<span class="switch"><input type="checkbox" data-setting="sound" '+(state.settings.sound?'checked':'')+'><span class="track"></span></span></label>'
  +'<label class="srow"><span class="s-ic">'+icon('leaf')+'</span>'
    +'<span class="s-name">Ambience<small>Crickets at night, birds by day</small></span>'
    +'<span class="switch"><input type="checkbox" data-setting="ambience" '+(state.settings.ambience?'checked':'')+'><span class="track"></span></span></label>'
  +'<label class="srow"><span class="s-ic">'+icon('vibe')+'</span>'
    +'<span class="s-name">Vibration<small>A little buzz on big moments</small></span>'
    +'<span class="switch"><input type="checkbox" data-setting="haptic" '+(state.settings.haptic?'checked':'')+'><span class="track"></span></span></label>'
  +'<div class="srow static"><span class="s-ic">'+(state.settings.theme==='day'?icon('sun'):icon('moon'))+'</span>'
    +'<span class="s-name">Theme<small>Night heist or daylight sting</small></span>'
    +'<div class="seg">'
      +'<button class="seg-btn'+(state.settings.theme!=='day'?' sel':'')+'" data-action="set-theme" data-v="night">Night</button>'
      +'<button class="seg-btn'+(state.settings.theme==='day'?' sel':'')+'" data-action="set-theme" data-v="day">Day</button>'
    +'</div></div>'
  +swRow
  +(inGame?'<button class="btn btn-danger btn-block" data-action="end-game">'+icon('home')+'End game &amp; go home</button>':'')
  +'<div class="sh-foot">MASQUE · a pass-and-play party game</div></div>';
}
function openSheet(kind){
  state.sheet=kind;
  if(!sheetHost){
    sheetHost=document.createElement('div');
    sheetHost.className='sheet-host';
    sheetHost.setAttribute('role','dialog');
    sheetHost.setAttribute('aria-modal','true');
    document.body.appendChild(sheetHost);
    sheetHost.addEventListener('click',function(e){
      if(e.target===sheetHost){closeSheet();return;}
      const el=e.target.closest('[data-action]');
      if(!el)return;
      const a=el.dataset.action;
      if(a==='close-sheet')closeSheet();
      else if(a==='set-theme'){
        state.settings.theme=el.dataset.v;
        applyTheme();syncThemeIcon();saveState();
        sheetHost.innerHTML=sheetInner();
      }
      else if(a==='save-sw')downloadSW();
      else if(a==='end-game'){closeSheet();ACTIONS['end-game']();}
    });
    sheetHost.addEventListener('change',function(e){
      const k=e.target.dataset.setting;
      if(!k)return;
      const v=e.target.checked;
      if(k==='sound')state.settings.sound=v;
      else if(k==='haptic')state.settings.haptic=v;
      else if(k==='ambience')state.settings.ambience=v;
      saveState();
    });
  }
  sheetHost.innerHTML=sheetInner();
}
function closeSheet(){state.sheet=null;if(sheetHost){sheetHost.remove();sheetHost=null;}}
function syncThemeIcon(){
  const b=document.getElementById('btnTheme');
  if(b)b.innerHTML=state.settings.theme==='day'?icon('moon'):icon('sun');
}

/* ============================================================
   Surgical interactions (no re-render → no jank)
   ============================================================ */
function selectVote(id){
  if(state.firing)return;
  state.voteSel = state.voteSel===id ? null : id;
  const sel=state.voteSel;
  document.querySelectorAll('.vcard').forEach(el=>{
    el.classList.toggle('sel', +el.dataset.id===sel);
  });
  const grid=document.getElementById('voteGrid');
  if(grid)grid.classList.toggle('focus', sel!=null);
  const btn=document.getElementById('fireBtn');
  if(btn)btn.disabled = sel==null;
  const lab=document.getElementById('fireLabel');
  if(lab)lab.textContent = sel!=null ? 'Fire at '+byId(sel).name : 'Pick a suspect';
  sfx.tap();haptic(8);
  saveState();
}
function flipPeekCard(){
  const pk=document.querySelector('.peek');
  if(pk)pk.classList.add('flipped');
  state.pick.flipped=true;
  sfx.flip();haptic(15);
  saveState();
}
function toggleFullscreen(){
  const d=document;
  if(!d.fullscreenElement){
    const el=d.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  }else{
    (d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);
  }
}

/* ============================================================
   Actions
   ============================================================ */
const ACTIONS={
  'go-home'(){closeSheet();goTo('home');},
  'go-lobby'(){closeSheet();goTo('lobby');},
  'open-settings'(){openSheet('settings');},
  'open-rules'(){openSheet('rules');},
  'toggle-theme'(){
    state.settings.theme=state.settings.theme==='day'?'night':'day';
    applyTheme();syncThemeIcon();saveState();
  },
  'toggle-fullscreen'(){toggleFullscreen();},
  'players+'(){setPlayerCount(1);},
  'players-'(){setPlayerCount(-1);},
  'under+'(){setRoleCount('undercoverCount',1);},
  'under-'(){setRoleCount('undercoverCount',-1);},
  'white+'(){setRoleCount('mrWhiteCount',1);},
  'white-'(){setRoleCount('mrWhiteCount',-1);},
  'start-game'(){startGame();},
  'pick-who'(el){pickWho(+el.dataset.id);},
  'pick-back'(){state.pick.phase='who';state.pick.who=null;persistRender();},
  'pick-card'(el){pickCard(+el.dataset.idx);},
  'flip-card'(){flipPeekCard();},
  'cancel-peek'(){state.pick.phase='choose';state.pick.chosen=null;state.pick.flipped=false;persistRender();},
  'hide-card'(){hideCard();},
  'start-voting'(){state.voteSel=null;goTo('voting');},
  'select-player'(el){selectVote(+el.dataset.id);},
  'fire'(){fire();},
  'continue-elim'(){afterVoteout();},
  'submit-guess'(){submitGuess();},
  'play-again'(){startGame();},
  'end-game'(){
    closeSheet();
    const keep=state.settings;
    Object.assign(state,getInitialState());
    state.settings=keep;
    applyTheme();
    goTo('home');
  }
};
const QUIET=['flip-card','fire','select-player','pick-card','pick-who','submit-guess'];

app.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  if(ACTIONS[a]){
    if(!QUIET.includes(a))sfx.tap();
    ACTIONS[a](el,e);
  }
});
app.addEventListener('change',function(e){
  const k=e.target.dataset.setting;
  if(!k)return;
  const v=e.target.checked;
  if(k==='names'){state.setup.useNames=v;persistRender();}
  else if(k==='reveal'){state.setup.revealRoles=v;saveState();}
});
app.addEventListener('input',function(e){
  const el=e.target;
  if(el.dataset&&el.dataset.nameIdx!==undefined){
    const i=+el.dataset.nameIdx;
    state.setup.names[i]=el.value;
    saveNames();saveState();
  }
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='guessInput'){
    e.preventDefault();
    ACTIONS['submit-guess']();
  }
});

/* ============================================================
   PWA — runtime manifest (canvas icons) + service worker.
   The worker itself must live in sw.js beside index.html;
   Settings can generate that file with one tap.
   ============================================================ */
const SW_SRC=`/* MASQUE service worker — offline cache for GitHub Pages */
const CACHE='masque-v1';
const CORE=['./','./index.html'];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()));
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
});
self.addEventListener('fetch',e=>{
  const req=e.request;
  if(req.method!=='GET')return;
  if(req.mode==='navigate'){
    e.respondWith((async()=>{
      try{
        const res=await fetch(req);
        const cp=res.clone();
        const c=await caches.open(CACHE);
        c.put(req,cp);
        return res;
      }catch(err){
        return (await caches.match(req))||(await caches.match('./'));
      }
    })());
    return;
  }
  e.respondWith((async()=>{
    const hit=await caches.match(req);
    try{
      const res=await fetch(req);
      if(res&&(res.ok||res.type==='opaque')){
        const cp=res.clone();
        const c=await caches.open(CACHE);
        await c.put(req,cp);
      }
      return res;
    }catch(err){
      return hit;
    }
  })());
});
`;
let swActive=false;
function iconPNG(size,maskable){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,size);
  g.addColorStop(0,'#2A3572');g.addColorStop(1,'#0D1233');
  x.fillStyle=g;
  if(maskable){x.fillRect(0,0,size,size);}
  else if(x.roundRect){x.beginPath();x.roundRect(0,0,size,size,size*.22);x.fill();}
  else{x.fillRect(0,0,size,size);}
  x.fillStyle='rgba(255,255,255,.85)';
  [[.18,.16],[.8,.1],[.65,.28],[.12,.46],[.9,.4]].forEach(function(p){
    x.beginPath();x.arc(p[0]*size,p[1]*size,Math.max(1,size*.012),0,7);x.fill();
  });
  x.save();
  x.translate(size/2,size/2);
  const sc=(maskable?.6:.78)*size/100;
  x.scale(sc,sc);
  x.fillStyle='#FFC531';
  x.beginPath();
  x.moveTo(-38,-2);
  x.bezierCurveTo(-26,-17,-8,-15,0,-4);
  x.bezierCurveTo(8,-15,26,-17,38,-2);
  x.bezierCurveTo(32,14,18,18,10,9);
  x.bezierCurveTo(6,6,-6,6,-10,9);
  x.bezierCurveTo(-18,18,-32,14,-38,-2);
  x.closePath();x.fill();
  x.fillStyle='#141B44';
  x.beginPath();x.ellipse(-19,-3,7.5,5,0,0,7);x.fill();
  x.beginPath();x.ellipse(19,-3,7.5,5,0,0,7);x.fill();
  x.restore();
  return {src:c.toDataURL('image/png'),sizes:size+'x'+size,type:'image/png',purpose:maskable?'maskable':'any'};
}
function downloadSW(){
  try{
    const blob=new Blob([SW_SRC],{type:'text/javascript'});
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u;a.download='sw.js';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Put sw.js next to index.html, then reload once');
  }catch(e){toast('Could not create the file');}
}
function initPWA(){
  try{
    const man={
      name:'MASQUE — Undercover Party Game',
      short_name:'MASQUE',
      description:'A social deduction party game. Everyone wears a word. Someone\u2019s is different.',
      start_url:'.',scope:'.',display:'standalone',orientation:'portrait',
      background_color:'#0D1233',theme_color:'#141B44',
      icons:[iconPNG(192,false),iconPNG(512,false),iconPNG(512,true)]
    };
    const l=document.createElement('link');
    l.rel='manifest';
    l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').then(function(){
      swActive=true;
      if(!localStorage.getItem('masque_sw_ok')){
        localStorage.setItem('masque_sw_ok','1');
        setTimeout(()=>toast('Offline ready — play without internet'),1500);
      }
    }).catch(function(){});
  }
}

/* ============================================================
   Sky & init
   ============================================================ */
function initSky(){
  const holder=document.getElementById('stars');
  let html='';
  for(let i=0;i<38;i++){
    const s=Math.random()<.85?2:3;
    html+='<span class="star" style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*62).toFixed(2)
      +'%;width:'+s+'px;height:'+s+'px;--tw:'+(2+Math.random()*3).toFixed(2)+'s;--twd:'+(Math.random()*4).toFixed(2)+'s"></span>';
  }
  holder.innerHTML=html;
}
function spawnShoot(){
  if(REDUCED)return;
  if(document.documentElement.dataset.theme==='day')return;
  const sky=document.querySelector('.sky');
  if(!sky)return;
  const s=document.createElement('div');
  s.className='sstar';
  s.style.top=(5+Math.random()*30)+'%';
  s.style.left=(15+Math.random()*65)+'%';
  sky.appendChild(s);
  setTimeout(()=>s.remove(),1400);
}

(function init(){
  loadNames();
  loadState();
  applyTheme();
  initSky();
  render();
  initPWA();
  setInterval(()=>{if(document.visibilityState==='visible')spawnShoot();},8000);
})();

})();
